
on:
    push:
        branches: [main, dev]
    workflow_dispatch:

jobs:
    ci_pipeline:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4
            - name: setup node
              uses: actions/setup-node@v4

            - name: install dependancies
              run: npm install
            
            - name: Set up Docker Build
              uses: docker/setup-buildx-action@v3 
            
            - name: docker build
              run: docker build -t ${{ vars.DOCKER_USERNAME }}/mynodeapp:latest .

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              
              with:
                 username: ${{ secrets.DOCKER_USERNAME }}
                 password: ${{ secrets.DOCKER_PASSWORD }}
                 
            - name: push docker
              run: docker push ${{ vars.DOCKER_USERNAME }}/mynodeapp:latest
              
            - name: test secrets key
              run: echo "KEY = ${{ vars.DOCKER_USERNAME }}"

    cd_pipeline:
        runs-on: ubuntu-latest
        needs: [ci_pipeline]
        steps:
          - name: Deploy to EC2
            uses: appleboy/ssh-action@v1.0.0
            with:
              host: ${{ secrets.EC2_HOST }}
              username: ${{ secrets.EC2_USERNAME }}
              key: ${{ secrets.EC2_SSH_KEY }}
              script: |
                docker pull ${{ vars.DOCKER_USERNAME }}/mynodeapp:latest
                docker stop app || true && docker rm app || true
                docker run -d --name app -p 3000:3000 ${{ vars.DOCKER_USERNAME }}/mynodeapp:latest
              

            

