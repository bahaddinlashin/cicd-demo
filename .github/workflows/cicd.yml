
on:
    push:
        branches: [main, dev]
    workflow_dispatch:

jobs:
    ci_ci_pipeline:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4
            - name: setup node
              uses: actions/setup-node@v4

            - name: install dependancies
              run: npm install
            
            - name: Set up Docker Build
              uses: docker/setup-buildx-action@v3 
            
            - name: docker build
              run: docker build -t ${{ vars.DOCKER_USERNAME }}/mynodeapp:latest .

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              
              with:
                 username: ${{ secrets.DOCKER_USERNAME }}
                 password: ${{ secrets.DOCKER_PASSWORD }}
                 
            - name: push docker
              run: docker push ${{ vars.DOCKER_USERNAME }}/mynodeapp:latest
              
            - name: test secrets key
              run: echo "KEY = ${{ vars.DOCKER_USERNAME }}"
            

            

